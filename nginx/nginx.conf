events {
    worker_connections 1024;
}

http {

    log_format mtls '$remote_addr - $ssl_client_s_dn - [$time_local] '
                    '"$request" $status cert_verify:$ssl_client_verify';

    access_log /var/log/nginx/access.log mtls;
    error_log  /var/log/nginx/error.log warn;

    upstream gateway_backend {
        server gateway:8000;
    }

    upstream trust_ws {
        server trust-engine:8001;
    }

    # ── HTTP — proxy to gateway ───────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        location /ws {
            proxy_pass          http://trust_ws;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host $host;
            proxy_read_timeout  3600s;
        }

        location / {
            proxy_pass         http://gateway_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Client-Verify "NONE";
            proxy_set_header   X-Client-DN     "none";
        }
    }

    # ── HTTPS + mTLS ──────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate        /certs/server.crt;
        ssl_certificate_key    /certs/server.key;
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client      optional;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        # WebSocket upgrade for live feed
        location /ws {
            proxy_pass         http://trust_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }

        # All API traffic — pass mTLS headers to gateway
        location / {
            proxy_pass         http://gateway_backend;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Client-Verify  $ssl_client_verify;
            proxy_set_header   X-Client-DN      $ssl_client_s_dn;
            proxy_read_timeout 30s;
        }
    }
}